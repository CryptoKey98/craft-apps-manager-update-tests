name: Internal app release catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: internal-app-release-catalog
  cancel-in-progress: false
jobs:
  refresh:
    name: Refresh signed internal catalog
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: automation
          sparse-checkout: scripts
      - name: Check out internal catalog
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: app-catalog-internal
          path: feed
      - name: Discover, inspect, sign and verify public metadata
        shell: pwsh
        working-directory: feed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APP_CATALOG_TEST_SIGNING_KEY: ${{ secrets.APP_CATALOG_TEST_SIGNING_KEY }}
          CATALOG_TOOL_SHA256: a7f3fc828d7d474518e07f782b57d2f923173d58be1b2d14b203279ea6bcd03c
        run: ../automation/scripts/refresh-app-catalog.ps1




